name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft_chrome:
        description: 'Chrome: upload as draft (skip review)'
        type: boolean
        default: false
      draft_firefox:
        description: 'Firefox: upload as draft (skip review)'
        type: boolean
        default: false

jobs:
  publish-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          chmod +x bin/build-zip.sh
          ./bin/build-zip.sh /tmp/vizonator.zip

      - name: Publish to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          chmod +x bin/publish-chrome.sh
          ./bin/publish-chrome.sh --zip /tmp/vizonator.zip ${{ inputs.draft_chrome && '--draft' || '' }}

  publish-firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          chmod +x bin/build-zip.sh
          ./bin/build-zip.sh /tmp/vizonator.zip

      - name: Publish to Firefox AMO
        env:
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
        run: |
          chmod +x bin/publish-firefox.sh
          ./bin/publish-firefox.sh --zip /tmp/vizonator.zip ${{ inputs.draft_firefox && '--draft' || '' }}
