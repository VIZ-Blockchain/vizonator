name: Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)publish, e.g. v0.76. Empty = current ref'
        type: string
        default: ''
      skip_stores:
        description: 'Skip store upload (GitHub Release only)'
        type: boolean
        default: false
      draft_chrome:
        description: 'Chrome: upload as draft (skip review)'
        type: boolean
        default: false
      draft_firefox:
        description: 'Firefox: upload as draft (skip review)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Gate: the suite must be green and the tag must match both manifests,
  # otherwise nothing reaches the stores.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Version guard
        run: |
          CHROME_V=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          FF_V=$(python3 -c "import json;print(json.load(open('manifest-firefox.json'))['version'])")
          echo "manifest.json=$CHROME_V manifest-firefox.json=$FF_V"
          if [ "$CHROME_V" != "$FF_V" ]; then
            echo "::error::manifest.json ($CHROME_V) and manifest-firefox.json ($FF_V) disagree"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_V="${GITHUB_REF_NAME#v}"
            if [ "$TAG_V" != "$CHROME_V" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version $CHROME_V"
              exit 1
            fi
          fi

      - name: Test suite
        # google-chrome is preinstalled on ubuntu-latest; no apt needed
        # (an apt install here used to hang on a dead Ubuntu mirror).
        env:
          CHROMIUM_BIN: google-chrome
        run: |
          chmod +x bin/run-tests.sh
          ./bin/run-tests.sh

  publish-chrome:
    needs: check
    if: ${{ !inputs.skip_stores }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build ZIP
        run: |
          chmod +x bin/build-zip.sh
          ./bin/build-zip.sh chrome /tmp/vizonator-chrome.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vizonator-chrome
          path: /tmp/vizonator-chrome.zip

      - name: Publish to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          chmod +x bin/publish-chrome.sh
          ./bin/publish-chrome.sh --zip /tmp/vizonator-chrome.zip ${{ inputs.draft_chrome && '--draft' || '' }}

  publish-firefox:
    needs: check
    if: ${{ !inputs.skip_stores }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build ZIP
        run: |
          chmod +x bin/build-zip.sh
          ./bin/build-zip.sh firefox /tmp/vizonator-firefox.zip

      - uses: actions/upload-artifact@v4
        with:
          name: vizonator-firefox
          path: /tmp/vizonator-firefox.zip

      - name: Publish to Firefox AMO
        env:
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
        run: |
          chmod +x bin/publish-firefox.sh
          ./bin/publish-firefox.sh --zip /tmp/vizonator-firefox.zip ${{ inputs.draft_firefox && '--draft' || '' }}

  # Until 0.75 this was done by hand: publish.yml only fed the stores.
  release:
    needs: [check, publish-chrome, publish-firefox]
    if: >-
      ${{ !cancelled()
          && needs.check.result == 'success'
          && needs.publish-chrome.result != 'failure'
          && needs.publish-firefox.result != 'failure'
          && (github.ref_type == 'tag' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # Built here, not downloaded: the release must be reproducible even when
      # the store jobs were skipped (repair run for an already published tag).
      - name: Build both ZIPs
        run: |
          chmod +x bin/build-zip.sh
          ./bin/build-zip.sh chrome /tmp/vizonator-chrome.zip
          ./bin/build-zip.sh firefox /tmp/vizonator-firefox.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            if [ -n "$PREV" ]; then
              echo "Изменения с ${PREV}:"
              echo
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
            else
              git log --no-merges --pretty='- %s' -20 "${TAG}"
            fi
            echo
            echo "Ставить из магазинов (Chrome Web Store / Firefox AMO); ZIP приложены для ручной установки."
          } > /tmp/notes.md
          cat /tmp/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/vizonator-chrome.zip /tmp/vizonator-firefox.zip --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md \
              /tmp/vizonator-chrome.zip /tmp/vizonator-firefox.zip
          fi
