name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test suite
        env:
          CHROMIUM_BIN: google-chrome
        run: |
          chmod +x bin/run-tests.sh
          ./bin/run-tests.sh
